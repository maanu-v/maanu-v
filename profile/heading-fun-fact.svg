<svg xmlns="http://www.w3.org/2000/svg" width="860" height="52" viewBox="0 0 860 52" role="img" aria-label="Fun Fact">
<style>
.ln{opacity:0;animation:in .3s ease-out forwards}
.pulse{animation:pulse 1.6s ease-in-out infinite}
.run{animation:run 4s linear infinite}
@keyframes in{to{opacity:1}}
@keyframes pulse{50%{opacity:.25}}
@keyframes run{from{transform:translateX(-220px)}to{transform:translateX(860px)}}
</style>
<defs><linearGradient id="g"><stop offset="0" stop-color="#7dd3fc" stop-opacity="0"/><stop offset=".5" stop-color="#7dd3fc"/><stop offset="1" stop-color="#7dd3fc" stop-opacity="0"/></linearGradient></defs>
<path class="pulse" d="M2 14l8 8-8 8" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path class="pulse" style="animation-delay:.25s" d="M14 14l8 8-8 8" fill="none" stroke="#7dd3fc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g class="ln" style="animation-delay:0ms"><text x="36" y="29" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="20" fill="#0ea5e9" font-weight="700" text-anchor="start" >F</text></g><g class="ln" style="animation-delay:45ms"><text x="51" y="29" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="20" fill="#0ea5e9" font-weight="700" text-anchor="start" >U</text></g><g class="ln" style="animation-delay:90ms"><text x="66" y="29" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="20" fill="#0ea5e9" font-weight="700" text-anchor="start" >N</text></g><g class="ln" style="animation-delay:180ms"><text x="96" y="29" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="20" fill="#0ea5e9" font-weight="700" text-anchor="start" >F</text></g><g class="ln" style="animation-delay:225ms"><text x="111" y="29" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="20" fill="#0ea5e9" font-weight="700" text-anchor="start" >A</text></g><g class="ln" style="animation-delay:270ms"><text x="126" y="29" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="20" fill="#0ea5e9" font-weight="700" text-anchor="start" >C</text></g><g class="ln" style="animation-delay:315ms"><text x="141" y="29" font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="20" fill="#0ea5e9" font-weight="700" text-anchor="start" >T</text></g>
